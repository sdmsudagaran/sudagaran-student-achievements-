<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sudagaran Student Achievements</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- jsPDF & AutoTable untuk PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              navy: '#152B4A',
              blue: '#315EE8',
              light: '#f1f5f9'
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body { background-color: #f8fafc; font-family: 'Inter', sans-serif; }
    .loader { border-top-color: #315EE8; -webkit-animation: spinner 1.5s linear infinite; animation: spinner 1.5s linear infinite; }
    @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .hide { display: none !important; }
    /* Scrollbar minimal */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f1f1f1; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>
</head>
<body class="text-slate-800 h-screen flex overflow-hidden">

  <!-- TOAST NOTIFICATION -->
  <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-2"></div>

  <!-- LOADING OVERLAY -->
  <div id="global-loader" class="fixed inset-0 bg-white/80 z-[100] flex flex-col justify-center items-center hide">
    <div class="loader ease-linear rounded-full border-4 border-t-4 border-gray-200 h-12 w-12 mb-4"></div>
    <h2 class="text-center text-brand-navy text-xl font-semibold">Memproses...</h2>
  </div>

  <!-- APP WRAPPER -->
  <div id="app-wrapper" class="w-full h-full flex hide">
    <!-- SIDEBAR -->
    <aside id="sidebar" class="bg-brand-navy text-white w-64 flex-shrink-0 flex flex-col transition-all duration-300">
      <div class="p-6 flex items-center justify-center border-b border-white/10">
        <img src="https://i.ibb.co.com/vCKNHYDW/logo-sekolah1.png" alt="Logo" class="h-12 bg-white rounded p-1 mr-3">
        <div>
          <h1 class="font-bold text-sm leading-tight">SD Sudagaran</h1>
          <p class="text-[10px] text-blue-200">Student Achievements</p>
        </div>
      </div>
      <nav id="nav-menu" class="flex-1 py-4 flex flex-col gap-1 px-3 overflow-y-auto"></nav>
      <div class="p-4 border-t border-white/10">
        <div class="flex items-center gap-3 mb-4">
          <div class="w-10 h-10 rounded-full bg-brand-blue flex items-center justify-center text-white font-bold" id="user-avatar">A</div>
          <div>
            <p class="text-sm font-semibold truncate w-32" id="user-name-display">-</p>
            <p class="text-xs text-blue-200 uppercase" id="user-role-display">-</p>
          </div>
        </div>
        <button onclick="app.logout()" class="w-full py-2 text-sm text-red-300 hover:text-white hover:bg-red-500/20 rounded transition flex items-center justify-center gap-2">
          <i class="fas fa-sign-out-alt"></i> Keluar
        </button>
      </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="flex-1 flex flex-col h-full bg-slate-50 relative overflow-hidden">
      <!-- Topbar Mobile Toggle -->
      <header class="md:hidden bg-white h-16 border-b flex items-center px-4 justify-between">
        <img src="https://i.ibb.co.com/vCKNHYDW/logo-sekolah1.png" class="h-8">
        <button onclick="document.getElementById('sidebar').classList.toggle('-ml-64')" class="text-brand-navy p-2">
          <i class="fas fa-bars text-xl"></i>
        </button>
      </header>

      <!-- View Container -->
      <div id="view-container" class="flex-1 overflow-y-auto p-4 md:p-8">
        <!-- Views will be injected here -->
      </div>
    </main>
  </div>

  <!-- LOGIN VIEW -->
  <div id="login-view" class="w-full h-full flex items-center justify-center bg-brand-light">
    <div class="bg-white p-8 rounded-xl shadow-xl w-full max-w-md border border-slate-100">
      <div class="text-center mb-8">
        <img src="https://i.ibb.co.com/vCKNHYDW/logo-sekolah1.png" alt="Logo" class="h-20 mx-auto mb-4">
        <h2 class="text-2xl font-bold text-brand-navy">Portal Prestasi Siswa</h2>
        <p class="text-slate-500 text-sm">Masuk dengan NIS / Akun Admin Anda</p>
      </div>
      <form id="login-form" onsubmit="app.handleLogin(event)">
    <!-- Input NIS -->
    <div class="mb-4">
        <label class="block text-sm font-medium text-slate-700 mb-1">NIS / Username</label>
        <input type="text" id="login-nis" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand-blue focus:border-brand-blue">
    </div>

    <!-- Input Password -->
    <div class="mb-6 relative">
        <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
        <div class="relative">
            <input type="password" id="login-password" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand-blue focus:border-brand-blue pr-10">
            <!-- Tombol Show/Hide Password -->
            <button type="button" id="togglePassword" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-500 hover:text-slate-700">
                <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.478 0-8.268-2.943-9.542-7z" />
                </svg>
            </button>
        </div>
    </div>

    <!-- Tombol Masuk -->
    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg transition duration-200">
        Masuk
    </button>
</form>

  <script>
    // --- KONFIGURASI APLIKASI ---
    // GANTI URL INI SETELAH DEPLOY GOOGLE APPS SCRIPT
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzxIsGt3L3RE9mWkKVYDLGqHcWuKq5yUB61PSS0YQ3J7JW2r11vZUk6OWueOn6LPpfNaw/exec"; 

    // --- STATE MANAGEMENT ---
    const app = {
      state: {
        token: sessionStorage.getItem('token') || null,
        user: JSON.parse(sessionStorage.getItem('user')) || null,
        currentView: '',
        data: {
          achievements: [],
          stats: null
        }
      },

      // --- INIT ---
      init: function() {
        if (this.state.token && this.state.user) {
          this.setupLayout();
          if (this.state.user.role === 'admin') this.navigate('admin-dashboard');
          else this.navigate('student-dashboard');
        } else {
          document.getElementById('login-view').classList.remove('hide');
          document.getElementById('app-wrapper').classList.add('hide');
        }
      },

      // --- API WRAPPER ---
      api: async function(action, data = {}) {
        this.showLoader();
        try {
          const payload = { action, data, token: this.state.token };
          const response = await fetch(GAS_URL, {
            method: 'POST',
            body: JSON.stringify(payload),
            headers: { 'Content-Type': 'text/plain;charset=utf-8' } // text/plain prevents CORS preflight in simple cases
          });
          const res = await response.json();
          if (res.status === 'error') throw new Error(res.message);
          this.hideLoader();
          return res.data;
        } catch (error) {
          this.hideLoader();
          this.toast(error.message, 'error');
          if (error.message.includes('Sesi tidak valid')) this.logout();
          throw error;
        }
      },

      // --- AUTHENTICATION ---
      handleLogin: async function(e) {
        e.preventDefault();
        const nis = document.getElementById('login-nis').value;
        const password = document.getElementById('login-password').value;

        try {
          const res = await this.api('login', { nis, password });
          this.state.token = res.token;
          this.state.user = res.user;
          sessionStorage.setItem('token', res.token);
          sessionStorage.setItem('user', JSON.stringify(res.user));
          
          this.toast('Berhasil masuk!', 'success');
          this.setupLayout();
          
          if (this.state.user.role === 'admin') this.navigate('admin-dashboard');
          else this.navigate('student-dashboard');
        } catch (err) {
          // Error handled by api wrapper
        }
      },

      logout: function() {
        sessionStorage.clear();
        this.state.token = null;
        this.state.user = null;
        document.getElementById('login-view').classList.remove('hide');
        document.getElementById('app-wrapper').classList.add('hide');
        document.getElementById('login-form').reset();
      },

      // --- UI HELPERS ---
      setupLayout: function() {
        document.getElementById('login-view').classList.add('hide');
        document.getElementById('app-wrapper').classList.remove('hide');
        
        document.getElementById('user-name-display').textContent = this.state.user.nama;
        document.getElementById('user-role-display').textContent = this.state.user.role;
        document.getElementById('user-avatar').textContent = this.state.user.nama.charAt(0);

        const nav = document.getElementById('nav-menu');
        nav.innerHTML = '';
        
        const menuItems = this.state.user.role === 'admin' ? [
          { id: 'admin-dashboard', icon: 'fa-chart-pie', text: 'Dasbor' },
          { id: 'admin-verify', icon: 'fa-check-double', text: 'Verifikasi & Data' },
          { id: 'admin-report', icon: 'fa-file-pdf', text: 'Laporan & Unduh' }
        ] : [
          { id: 'student-dashboard', icon: 'fa-list', text: 'Pengajuan Saya' },
          { id: 'student-form', icon: 'fa-plus-circle', text: 'Tambah Prestasi' }
        ];

        menuItems.forEach(item => {
          nav.innerHTML += `
            <button onclick="app.navigate('${item.id}')" id="nav-${item.id}" class="w-full flex items-center gap-3 px-4 py-3 rounded-lg text-slate-300 hover:bg-white/10 hover:text-white transition text-left text-sm font-medium">
              <i class="fas ${item.icon} w-5 text-center"></i> ${item.text}
            </button>
          `;
        });
      },

      navigate: function(viewId) {
        this.state.currentView = viewId;
        
        // Update Active Nav
        document.querySelectorAll('#nav-menu button').forEach(btn => {
          btn.classList.remove('bg-brand-blue', 'text-white');
          btn.classList.add('text-slate-300');
        });
        const activeBtn = document.getElementById(`nav-${viewId}`);
        if(activeBtn) {
          activeBtn.classList.remove('text-slate-300');
          activeBtn.classList.add('bg-brand-blue', 'text-white');
        }

        // Render View
        const container = document.getElementById('view-container');
        container.innerHTML = ''; // Clear

        switch(viewId) {
          case 'student-dashboard': this.renderStudentDashboard(container); break;
          case 'student-form': this.renderStudentForm(container); break;
          case 'admin-dashboard': this.renderAdminDashboard(container); break;
          case 'admin-verify': this.renderAdminData(container); break;
          case 'admin-report': this.renderAdminReport(container); break;
        }
      },

      showLoader: () => document.getElementById('global-loader').classList.remove('hide'),
      hideLoader: () => document.getElementById('global-loader').classList.add('hide'),
      
      toast: function(message, type = 'info') {
        const container = document.getElementById('toast-container');
        const bg = type === 'success' ? 'bg-green-500' : type === 'error' ? 'bg-red-500' : 'bg-brand-blue';
        const icon = type === 'success' ? 'fa-check' : type === 'error' ? 'fa-times' : 'fa-info';
        
        const toast = document.createElement('div');
        toast.className = `${bg} text-white px-6 py-3 rounded-lg shadow-lg flex items-center gap-3 transform transition-all duration-300 translate-x-full opacity-0`;
        toast.innerHTML = `<i class="fas ${icon}"></i> <span>${message}</span>`;
        
        container.appendChild(toast);
        
        setTimeout(() => { toast.classList.remove('translate-x-full', 'opacity-0'); }, 10);
        setTimeout(() => {
          toast.classList.add('translate-x-full', 'opacity-0');
          setTimeout(() => toast.remove(), 300);
        }, 4000);
      },

      // --- STUDENT VIEWS ---
      renderStudentDashboard: async function(container) {
        container.innerHTML = `
          <div class="flex justify-between items-center mb-6">
            <div>
              <h2 class="text-2xl font-bold text-brand-navy">Pengajuan Saya</h2>
              <p class="text-slate-500 text-sm">Daftar prestasi yang telah Anda laporkan.</p>
            </div>
            <button onclick="app.navigate('student-form')" class="bg-brand-blue text-white px-4 py-2 rounded-lg shadow hover:bg-blue-700 transition">
              <i class="fas fa-plus mr-1"></i> Tambah
            </button>
          </div>
          <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="overflow-x-auto">
              <table class="w-full text-left text-sm text-slate-600">
                <thead class="bg-slate-50 text-slate-700 border-b">
                  <tr>
                    <th class="px-6 py-4 font-semibold">Tgl Pengajuan</th>
                    <th class="px-6 py-4 font-semibold">Nama Event</th>
                    <th class="px-6 py-4 font-semibold">Capaian</th>
                    <th class="px-6 py-4 font-semibold">Tingkat</th>
                    <th class="px-6 py-4 font-semibold">Status</th>
                  </tr>
                </thead>
                <tbody id="student-table-body" class="divide-y divide-slate-100">
                  <tr><td colspan="5" class="text-center py-8 text-slate-400">Memuat data...</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        `;

        try {
          const data = await this.api('getStudentAchievements');
          const tbody = document.getElementById('student-table-body');
          if (data.length === 0) {
            tbody.innerHTML = `<tr><td colspan="5" class="text-center py-8 text-slate-400">Belum ada pengajuan prestasi.</td></tr>`;
            return;
          }

          tbody.innerHTML = data.map(item => `
            <tr class="hover:bg-slate-50">
              <td class="px-6 py-4 whitespace-nowrap">${item.CreatedAt.split(' ')[0]}</td>
              <td class="px-6 py-4 font-medium text-slate-800">${item.NamaEvent}</td>
              <td class="px-6 py-4">${item.Capaian}</td>
              <td class="px-6 py-4">${item.TingkatKejuaraan}</td>
              <td class="px-6 py-4">
                <span class="px-3 py-1 rounded-full text-xs font-semibold ${this.getStatusColor(item.StatusVerifikasi)}">
                  ${item.StatusVerifikasi}
                </span>
                ${item.CatatanVerifikasi ? `<p class="text-xs text-red-500 mt-1"><i class="fas fa-exclamation-circle"></i> ${item.CatatanVerifikasi}</p>` : ''}
              </td>
            </tr>
          `).join('');
        } catch (e) {
          // error handled
        }
      },

      getStatusColor: function(status) {
        switch(status) {
          case 'Terverifikasi': return 'bg-green-100 text-green-700';
          case 'Menunggu Verifikasi': return 'bg-amber-100 text-amber-700';
          case 'Perlu Perbaikan': return 'bg-orange-100 text-orange-700';
          case 'Ditolak': return 'bg-red-100 text-red-700';
          default: return 'bg-slate-100 text-slate-700';
        }
      },

      renderStudentForm: function(container) {
        const u = this.state.user;
        container.innerHTML = `
          <div class="max-w-3xl mx-auto">
            <button onclick="app.navigate('student-dashboard')" class="text-slate-500 hover:text-brand-navy mb-4 inline-flex items-center gap-2">
              <i class="fas fa-arrow-left"></i> Kembali
            </button>
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 md:p-8">
              <h2 class="text-2xl font-bold text-brand-navy border-b pb-4 mb-6">Formulir Pengajuan Prestasi</h2>
              
              <form id="achievement-form" onsubmit="app.submitAchievement(event)">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                  <!-- Data Siswa (Readonly) -->
                  <div class="bg-slate-50 p-4 rounded-lg md:col-span-2 border border-slate-100">
                    <p class="text-xs text-slate-500 uppercase font-semibold mb-2">Data Siswa</p>
                    <div class="grid grid-cols-2 md:grid-cols-3 gap-4 text-sm">
                      <div><span class="block text-slate-500">Nama:</span><span class="font-medium text-slate-800">${u.nama}</span></div>
                      <div><span class="block text-slate-500">NIS:</span><span class="font-medium text-slate-800">${u.nis}</span></div>
                      <div><span class="block text-slate-500">Kelas:</span><span class="font-medium text-slate-800">${u.kelas}</span></div>
                    </div>
                  </div>

                  <!-- Form Fields -->
                  <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Tahun Ajaran <span class="text-red-500">*</span></label>
                    <select id="tahunAjaran" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand-blue outline-none">
                      <option value="2025/2026">2025/2026</option>
                      <option value="2026/2027" selected>2026/2027</option>
                      <option value="2027/2028">2027/2028</option>
                    </select>
                  </div>
                  <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Nama Event / Kejuaraan <span class="text-red-500">*</span></label>
                    <input type="text" id="namaEvent" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand-blue outline-none" placeholder="Contoh: Olimpiade Matematika Nasional">
                  </div>
                  
                  <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Kategori <span class="text-red-500">*</span></label>
                    <select id="kategori" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand-blue outline-none">
                      <option value="" disabled selected>Pilih Kategori</option>
                      <option value="Akademik">Akademik</option>
                      <option value="Non Akademik">Non Akademik</option>
                    </select>
                  </div>
                  <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Cabang Lomba <span class="text-red-500">*</span></label>
                    <select id="cabangLomba" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand-blue outline-none">
                      <option value="" disabled selected>Pilih Cabang</option>
                      <option value="Matematika">Matematika</option>
                      <option value="IPA">IPA</option>
                      <option value="Bahasa Inggris">Bahasa Inggris</option>
                      <option value="Tahfiz">Tahfiz</option>
                      <option value="Pidato">Pidato</option>
                      <option value="Seni">Seni / Menggambar</option>
                      <option value="Olahraga">Olahraga</option>
                      <option value="Lainnya">Lainnya</option>
                    </select>
                  </div>

                  <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Tingkat Kejuaraan <span class="text-red-500">*</span></label>
                    <select id="tingkat" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand-blue outline-none">
                      <option value="" disabled selected>Pilih Tingkat</option>
                      <option value="Kecamatan">Kecamatan</option>
                      <option value="Kabupaten/Kota">Kabupaten/Kota</option>
                      <option value="Provinsi">Provinsi</option>
                      <option value="Nasional">Nasional</option>
                      <option value="Internasional">Internasional</option>
                    </select>
                  </div>
                  <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Capaian / Juara <span class="text-red-500">*</span></label>
                    <select id="capaian" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand-blue outline-none">
                      <option value="" disabled selected>Pilih Capaian</option>
                      <option value="Juara 1">Juara 1</option>
                      <option value="Juara 2">Juara 2</option>
                      <option value="Juara 3">Juara 3</option>
                      <option value="Harapan 1">Harapan 1</option>
                      <option value="Medali Emas">Medali Emas</option>
                      <option value="Medali Perak">Medali Perak</option>
                      <option value="Peserta">Peserta/Finalis</option>
                    </select>
                  </div>

                  <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Nama Penyelenggara <span class="text-red-500">*</span></label>
                    <input type="text" id="penyelenggara" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand-blue outline-none">
                  </div>
                  <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Jenis Penyelenggara <span class="text-red-500">*</span></label>
                    <select id="jenisPenyelenggara" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand-blue outline-none">
                      <option value="Pemerintah">Pemerintah (Dinas/Kementerian)</option>
                      <option value="Institusi Pendidikan">Institusi Pendidikan/Sekolah</option>
                      <option value="Non Pemerintah">Non Pemerintah/Yayasan</option>
                    </select>
                  </div>

                  <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Tanggal Pelaksanaan <span class="text-red-500">*</span></label>
                    <input type="date" id="tanggal" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand-blue outline-none">
                  </div>
                  <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Lokasi Lomba (Kota)</label>
                    <input type="text" id="lokasi" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand-blue outline-none">
                  </div>

                  <!-- File Upload -->
                  <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-slate-700 mb-1">Sertifikat / Piagam (PDF/JPG/PNG) <span class="text-red-500">*</span></label>
                    <div class="border-2 border-dashed border-slate-300 rounded-lg p-6 text-center hover:bg-slate-50 transition cursor-pointer" onclick="document.getElementById('fileInput').click()">
                      <i class="fas fa-cloud-upload-alt text-3xl text-brand-blue mb-2"></i>
                      <p class="text-sm font-medium text-slate-700" id="fileNameDisplay">Klik untuk memilih file</p>
                      <p class="text-xs text-slate-500 mt-1">Maks. ukuran 5MB (Batas aman API)</p>

      handleFileSelect: function(e) {
        const file = e.target.files[0];
        if (!file) return;
        
        // Validasi Ukuran (5MB untuk menjaga Payload limit GAS tidak timeout)
        if (file.size > 5 * 1024 * 1024) {
          this.toast('Ukuran file terlalu besar. Maksimal 5MB.', 'error');
          e.target.value = '';
          return;
        }
        
        this.selectedFile = file;
        document.getElementById('fileNameDisplay').innerHTML = `<span class="text-green-600 font-bold"><i class="fas fa-file-check"></i> ${file.name}</span>`;
      },

      submitAchievement: async function(e) {
        e.preventDefault();
        if (!this.selectedFile) {
          this.toast('Silakan unggah file piagam/sertifikat terlebih dahulu.', 'error');
          return;
        }

        // Convert file to Base64
        const reader = new FileReader();
        reader.readAsDataURL(this.selectedFile);
        reader.onload = async () => {
          const payload = {
            tahunAjaran: document.getElementById('tahunAjaran').value,
            namaEvent: document.getElementById('namaEvent').value,
            kategori: document.getElementById('kategori').value,
            cabangLomba: document.getElementById('cabangLomba').value,
            tingkat: document.getElementById('tingkat').value,
            capaian: document.getElementById('capaian').value,
            penyelenggara: document.getElementById('penyelenggara').value,
            jenisPenyelenggara: document.getElementById('jenisPenyelenggara').value,
            tanggal: document.getElementById('tanggal').value,
            lokasi: document.getElementById('lokasi').value,
            fileName: this.selectedFile.name,
            fileBase64: reader.result
          };

          try {
            await this.api('submitAchievement', payload);
            this.toast('Pengajuan berhasil dikirim!', 'success');
            this.selectedFile = null;
            this.navigate('student-dashboard');
          } catch (err) {
            // error handled
          }
        };
      },

      downloadReport: async function(type) {
        const filters = {
          tahunAjaran: document.getElementById('rep-tahun').value,
          kategori: document.getElementById('rep-kategori').value,
          tingkat: document.getElementById('rep-tingkat').value,
          status: document.getElementById('rep-status').value
        };

        try {
          const data = await this.api('getAllAchievements', { filters });
          
          if (data.length === 0) {
            this.toast('Tidak ada data yang cocok dengan filter.', 'error');
            return;
          }

          if (type === 'csv') {
            this.generateCSV(data, filters);
          } else if (type === 'pdf') {
            this.generatePDF(data, filters);
          }
        } catch (e) {}
      },

      generateCSV: function(data, filters) {
        // Prepare headers (excluding internal IDs)
        const headers = ["No", "Tahun Ajaran", "NIS", "Nama Siswa", "Kelas", "Kategori", "Cabang Lomba", "Nama Event", "Capaian", "Tingkat", "Penyelenggara", "Tanggal Pelaksanaan", "Status"];
        
        let csvContent = "data:text/csv;charset=utf-8,\uFEFF"; // UTF-8 BOM
        csvContent += headers.join(",") + "\r\n";

        data.forEach((row, index) => {
          let rowArray = [
            index + 1,
            `"${row.TahunAjaran}"`, `"${row.NIS}"`, `"${row.NamaSnapshot}"`, `"${row.KelasSnapshot}"`,
            `"${row.Kategori}"`, `"${row.CabangLomba}"`, `"${row.NamaEvent.replace(/"/g, '""')}"`,
            `"${row.Capaian}"`, `"${row.TingkatKejuaraan}"`, `"${row.NamaPenyelenggara.replace(/"/g, '""')}"`,
            `"${row.TanggalPelaksanaan}"`, `"${row.StatusVerifikasi}"`
          ];
          csvContent += rowArray.join(",") + "\r\n";
        });

        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        const dateStr = new Date().toISOString().split('T')[0];
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `Rekap_Prestasi_SD_Sudagaran_${dateStr}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        this.toast('CSV berhasil diunduh.', 'success');
      },

      generatePDF: function(data, filters) {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF('landscape');
        
        // Header
        doc.setFont("helvetica", "bold");
        doc.setFontSize(16);
        doc.setTextColor(21, 43, 74); // Navy
        doc.text("LAPORAN PRESTASI SISWA - SD SUDAGARAN", 14, 20);
        
        doc.setFontSize(10);
        doc.setFont("helvetica", "normal");
        doc.setTextColor(100, 100, 100);
        
        // Filter Text
        let filterText = `Tahun: ${filters.tahunAjaran || 'Semua'} | Kategori: ${filters.kategori || 'Semua'} | Tingkat: ${filters.tingkat || 'Semua'} | Status: ${filters.status || 'Semua'}`;
        doc.text(`Filter diterapkan: ${filterText}`, 14, 28);
        doc.text(`Total Data: ${data.length} pengajuan`, 14, 34);
        doc.text(`Dicetak pada: ${new Date().toLocaleString('id-ID', {timeZone: 'Asia/Jakarta'})}`, 14, 40);

        // Table
        const tableColumn = ["No", "NIS", "Nama Siswa", "Kelas", "Kategori", "Cabang Lomba", "Nama Event", "Capaian", "Tingkat", "Status"];
        const tableRows = [];

        data.forEach((row, index) => {
          tableRows.push([
            index + 1, row.NIS, row.NamaSnapshot, row.KelasSnapshot,
            row.Kategori, row.CabangLomba, row.NamaEvent,
            row.Capaian, row.TingkatKejuaraan, row.StatusVerifikasi
          ]);
        });

        doc.autoTable({
          head: [tableColumn],
          body: tableRows,
          startY: 45,
          styles: { fontSize: 8, font: "helvetica", cellPadding: 2 },
          headStyles: { fillColor: [49, 94, 232], textColor: 255 }, // Brand Blue
          alternateRowStyles: { fillColor: [248, 250, 252] },
          didDrawPage: function (data) {
            let str = "Halaman " + doc.internal.getNumberOfPages();
            doc.setFontSize(8);
            doc.text(str, data.settings.margin.left, doc.internal.pageSize.height - 10);
          }
        });

        const dateStr = new Date().toISOString().split('T')[0];
        doc.save(`Laporan_Prestasi_${dateStr}.pdf`);
        this.toast('PDF berhasil diunduh.', 'success');
      }
    };

    document.getElementById('togglePassword').addEventListener('click', function () {
    const passwordInput = document.getElementById('password');
    const eyeIcon = document.getElementById('eyeIcon');
    
    if (passwordInput.type === 'password') {
        // Ubah ke mode teks
        passwordInput.type = 'text';
        // Ubah ikon menjadi mata dicoret
        eyeIcon.innerHTML = `
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7a9.978 9.978 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.542 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
        `;
    } else {
        // Kembalikan ke mode password
        passwordInput.type = 'password';
        // Kembalikan ikon ke mata terbuka
        eyeIcon.innerHTML = `
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.478 0-8.268-2.943-9.542-7z" />
        `;
    }
});

    // Initialize App
    document.addEventListener("DOMContentLoaded", () => {
      app.init();
    });
  </script>
